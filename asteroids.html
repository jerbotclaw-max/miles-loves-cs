<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asteroids</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Courier New', monospace; color: #0ff; overflow: hidden; }
canvas { border: 2px solid #0ff; }
#score { position: fixed; top: 10px; left: 20px; font-size: 18px; }
#lives { position: fixed; top: 10px; right: 20px; font-size: 18px; }
#msg { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); color: #0ff; font-size: 14px; text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
#msg.show { opacity: 1; }
#mute { position: fixed; top: 10px; right: 100px; background: none; border: 1px solid #0ff; color: #0ff; padding: 4px 10px; cursor: pointer; font-family: inherit; font-size: 14px; z-index: 20; }
#start { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #0ff; font-size: 24px; z-index: 15; cursor: pointer; }
</style>
</head>
<body>
<div id="score">Score: 0</div>
<div id="lives">❤️❤️❤️</div>
<button id="mute">🔊</button>
<div id="start">PRESS SPACE TO PLAY</div>
<div id="msg"></div>
<canvas id="c" width="800" height="600"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
let muted = false;
document.getElementById('mute').onclick = () => { muted = !muted; document.getElementById('mute').textContent = muted ? '🔇' : '🔊'; };
const audio = { play(n) { if (muted) return; new Audio('audio/' + n + '.mp3').play().catch(()=>{}); } };

const W = 800, H = 600;
let ship, asteroids, bullets, score, lives, started = false, gameOver = false, msgTimer = 0, shootCD = 0;

function showMsg(t, d=3000) {
  const el = document.getElementById('msg'); el.textContent = t; el.classList.add('show');
  clearTimeout(msgTimer); msgTimer = setTimeout(() => el.classList.remove('show'), d);
}

function init() {
  ship = { x: 400, y: 300, angle: 0, vx: 0, vy: 0, r: 15 };
  asteroids = []; bullets = []; score = 0; lives = 3; gameOver = false;
  for (let i = 0; i < 5; i++) asteroids.push(makeAsteroid());
  document.getElementById('score').textContent = 'Score: 0';
  document.getElementById('lives').textContent = '❤️'.repeat(3);
}

function makeAsteroid(x, y, sz) {
  sz = sz || 3;
  return {
    x: x !== undefined ? x : Math.random() * W, y: y !== undefined ? y : Math.random() * H,
    vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3,
    r: sz * 15, sz,
    a: Math.random() * Math.PI * 2, va: (Math.random() - 0.5) * 0.04
  };
}

let keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' && !started) { started = true; document.getElementById('start').style.display = 'none'; audio.play('asteroids-start'); showMsg('"Space is the next frontier"'); init(); }
  if (e.code === 'Space' && gameOver) { init(); gameOver = false; }
});
document.addEventListener('keyup', e => keys[e.code] = false);

function wrap(obj) {
  if (obj.x < 0) obj.x += W; if (obj.x > W) obj.x -= W;
  if (obj.y < 0) obj.y += H; if (obj.y > H) obj.y -= H;
}

function update() {
  if (!started || gameOver) return;
  if (keys['ArrowLeft']) ship.angle -= 0.06;
  if (keys['ArrowRight']) ship.angle += 0.06;
  if (keys['ArrowUp']) { ship.vx += Math.cos(ship.angle) * 0.12; ship.vy += Math.sin(ship.angle) * 0.12; }
  ship.vx *= 0.99; ship.vy *= 0.99;
  ship.x += ship.vx; ship.y += ship.vy; wrap(ship);
  if (shootCD > 0) shootCD--;
  if (keys[' '] && shootCD === 0) {
    bullets.push({ x: ship.x + Math.cos(ship.angle) * 20, y: ship.y + Math.sin(ship.angle) * 20, vx: Math.cos(ship.angle) * 7 + ship.vx * 0.3, vy: Math.sin(ship.angle) * 7 + ship.vy * 0.3, life: 50 });
    shootCD = 10;
  }
  bullets.forEach(b => { b.x += b.vx; b.y += b.vy; b.life--; wrap(b); });
  bullets = bullets.filter(b => b.life > 0);
  asteroids.forEach(a => { a.x += a.vx; a.y += a.vy; a.a += a.va; wrap(a); });

  // Collision: bullet-asteroid
  for (let i = bullets.length - 1; i >= 0; i--) {
    for (let j = asteroids.length - 1; j >= 0; j--) {
      const dx = bullets[i].x - asteroids[j].x, dy = bullets[i].y - asteroids[j].y;
      if (Math.sqrt(dx*dx + dy*dy) < asteroids[j].r) {
        score += (4 - asteroids[j].sz) * 10;
        document.getElementById('score').textContent = 'Score: ' + score;
        if (asteroids[j].sz > 1) {
          asteroids.push(makeAsteroid(asteroids[j].x, asteroids[j].y, asteroids[j].sz - 1));
          asteroids.push(makeAsteroid(asteroids[j].x, asteroids[j].y, asteroids[j].sz - 1));
        }
        asteroids.splice(j, 1); bullets.splice(i, 1);
        if (asteroids.length === 0) { for (let k = 0; k < 5 + Math.floor(score/500); k++) asteroids.push(makeAsteroid()); }
        break;
      }
    }
  }

  // Collision: ship-asteroid
  for (let a of asteroids) {
    const dx = ship.x - a.x, dy = ship.y - a.y;
    if (Math.sqrt(dx*dx + dy*dy) < a.r + ship.r) {
      lives--;
      document.getElementById('lives').textContent = '❤️'.repeat(lives);
      audio.play('asteroids-death');
      showMsg('"Moving fast and breaking things. The asteroid moved fast. You broke."', 4000);
      if (lives <= 0) { gameOver = true; showMsg('Game Over. "Moving fast and breaking things."', 5000); return; }
      ship.x = 400; ship.y = 300; ship.vx = 0; ship.vy = 0;
      break;
    }
  }
}

function draw() {
  ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, W, H);
  if (!started) return;
  // Ship
  ctx.save(); ctx.translate(ship.x, ship.y); ctx.rotate(ship.angle);
  ctx.strokeStyle = '#0ff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(-12, -10); ctx.lineTo(-8, 0); ctx.lineTo(-12, 10); ctx.closePath(); ctx.stroke();
  ctx.restore();
  // Asteroids
  asteroids.forEach(a => {
    ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.a);
    ctx.strokeStyle = '#0aa'; ctx.lineWidth = 1.5; ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * Math.PI * 2, r = a.r * (0.8 + Math.sin(i * 3.7) * 0.2);
      i === 0 ? ctx.moveTo(Math.cos(ang)*r, Math.sin(ang)*r) : ctx.lineTo(Math.cos(ang)*r, Math.sin(ang)*r);
    }
    ctx.closePath(); ctx.stroke(); ctx.restore();
  });
  // Bullets
  ctx.fillStyle = '#0ff';
  bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 2, 0, Math.PI*2); ctx.fill(); });
  if (gameOver) {
    ctx.fillStyle = '#0ff'; ctx.font = '36px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/2); ctx.font = '16px Courier New'; ctx.fillText('Press SPACE to restart', W/2, H/2 + 40);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
