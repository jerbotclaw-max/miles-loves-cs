<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Courier New', monospace; color: #0f0; overflow: hidden; }
canvas { border: 2px solid #0f0; }
#score { position: fixed; top: 10px; left: 20px; font-size: 18px; }
#high { position: fixed; top: 10px; right: 20px; font-size: 18px; }
#msg { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); color: #0f0; font-size: 14px; text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
#msg.show { opacity: 1; }
#mute { position: fixed; top: 10px; right: 150px; background: none; border: 1px solid #0f0; color: #0f0; padding: 4px 10px; cursor: pointer; font-family: inherit; font-size: 14px; z-index: 20; }
#start { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #0f0; font-size: 24px; z-index: 15; }
</style>
</head>
<body>
<div id="score">Score: 0</div>
<div id="high">Best: 0</div>
<button id="mute">🔊</button>
<div id="start">PRESS SPACE TO PLAY</div>
<div id="msg"></div>
<canvas id="c" width="600" height="600"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
let muted = false;
document.getElementById('mute').onclick = () => { muted = !muted; document.getElementById('mute').textContent = muted ? '🔇' : '🔊'; };
const audio = { play(n) { if (muted) return; new Audio('audio/' + n + '.mp3').play().catch(()=>{}); } };

const GRID = 20, CELL = 30;
let snake, dir, food, score, high = 0, started = false, gameOver = false, msgTimer = 0, lastMove = 0;

function showMsg(t, d=3000) {
  const el = document.getElementById('msg'); el.textContent = t; el.classList.add('show');
  clearTimeout(msgTimer); msgTimer = setTimeout(() => el.classList.remove('show'), d);
}

function init() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  score = 0; gameOver = false;
  placeFood();
  document.getElementById('score').textContent = 'Score: 0';
}

function placeFood() {
  do { food = {x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID)}; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !started) { started = true; document.getElementById('start').style.display = 'none'; audio.play('snake-start'); init(); }
  if (e.code === 'Space' && gameOver) init();
  if (e.code === 'ArrowUp' && dir.y === 0) nextDir = {x:0,y:-1};
  if (e.code === 'ArrowDown' && dir.y === 0) nextDir = {x:0,y:1};
  if (e.code === 'ArrowLeft' && dir.x === 0) nextDir = {x:-1,y:0};
  if (e.code === 'ArrowRight' && dir.x === 0) nextDir = {x:1,y:0};
});
let nextDir = {x:1,y:0};

function update(ts) {
  if (!started || gameOver) return;
  if (ts - lastMove < 100) return;
  lastMove = ts;
  dir = {...nextDir};
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID || snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver = true;
    if (score > high) high = score;
    document.getElementById('high').textContent = 'Best: ' + high;
    audio.play('snake-death');
    showMsg('"Sustainable growth is hard"', 4000);
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').textContent = 'Score: ' + score;
    placeFood();
    if (score % 50 === 0) { audio.play('snake-score'); showMsg('"Every pixel matters at scale"', 3000); }
  } else { snake.pop(); }
}

function draw() {
  ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, 600, 600);
  if (!started) return;
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#0f0' : '#0a0';
    ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
  });
  ctx.fillStyle = '#ff0'; ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);
  if (gameOver) {
    ctx.fillStyle = '#0f0'; ctx.font = '36px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', 300, 280); ctx.font = '16px Courier New'; ctx.fillText('Press SPACE to restart', 300, 320);
  }
}

function loop(ts) { update(ts); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
