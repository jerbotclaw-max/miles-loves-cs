<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scores — Arcade Zone</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav></nav>
  <main>
    <h2 class="section-title">🏆 HIGH SCORES</h2>
    <div class="scores-filters">
      <button class="filter-btn active" onclick="filterScores('all')">ALL</button>
      <button class="filter-btn" onclick="filterScores('tetris')">TETRIS</button>
      <button class="filter-btn" onclick="filterScores('asteroids')">ASTEROIDS</button>
      <button class="filter-btn" onclick="filterScores('galaga')">GALAGA</button>
    </div>
    <table class="scores-table">
      <thead>
        <tr>
          <th>#</th>
          <th>PLAYER</th>
          <th>GAME</th>
          <th>SCORE</th>
          <th>DATE</th>
        </tr>
      </thead>
      <tbody id="scoresBody"></tbody>
    </table>
    <div id="noScores" class="board-empty" style="display:none;">No scores yet. Go play something!</div>
  </main>
  <footer>
    <p>👾 Arcade Zone — A School CS Project</p>
  </footer>
  <script src="js/auth.js"></script>
  <script src="js/scores.js"></script>
  <script src="js/common.js"></script>
  <script>
    let currentFilter = 'all';

    function filterScores(game) {
      currentFilter = game;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.textContent.toLowerCase() === game);
      });
      renderScores();
    }

    function renderScores() {
      const tbody = document.getElementById('scoresBody');
      const noEl = document.getElementById('noScores');
      let scores = currentFilter === 'all'
        ? Scores.getAllScores()
        : Scores.getScoresForGame(currentFilter);

      if (scores.length === 0) {
        tbody.innerHTML = '';
        noEl.style.display = 'block';
        return;
      }
      noEl.style.display = 'none';

      tbody.innerHTML = scores.map((s, i) => {
        const rankClass = i < 3 ? `rank-${i + 1}` : '';
        const badgeClass = s.game;
        return `<tr class="${rankClass}">
          <td>${i + 1}</td>
          <td>${escapeHtml(s.username)}</td>
          <td><span class="game-badge ${badgeClass}">${s.game.toUpperCase()}</span></td>
          <td>${s.score.toLocaleString()}</td>
          <td>${Scores.formatDate(s.date)}</td>
        </tr>`;
      }).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    renderScores();
  </script>
</body>
</html>
