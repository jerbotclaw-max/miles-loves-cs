<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board — Arcade Zone</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav></nav>
  <main>
    <h2 class="section-title">💬 MESSAGE BOARD</h2>
    <div id="postArea"></div>
    <div class="board-messages" id="messagesContainer">
      <div style="text-align:center;color:var(--text-secondary);padding:2rem;">Loading messages...</div>
    </div>
    <div id="noMessages" class="board-empty" style="display:none;">No messages yet. Be the first to post!</div>
  </main>
  <footer>
    <p>👾 Arcade Zone — A School CS Project</p>
  </footer>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script>
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderPostForm() {
      const area = document.getElementById('postArea');
      if (Auth.isLoggedIn()) {
        area.innerHTML = `
          <div class="board-post-form">
            <div class="form-group">
              <textarea id="msgInput" placeholder="Write a message..." maxlength="500"></textarea>
            </div>
            <button class="btn btn-primary btn-small" id="postBtn" onclick="postMessage()">POST</button>
          </div>`;
      } else {
        area.innerHTML = `
          <div class="login-prompt">
            <p>You need to log in to post messages.</p>
            <a href="login.html" class="btn btn-primary btn-small">LOGIN</a>
          </div>`;
      }
    }

    async function postMessage() {
      const input = document.getElementById('msgInput');
      const btn = document.getElementById('postBtn');
      const text = input.value.trim();
      if (!text) return;

      const user = Auth.getCurrentUser();
      btn.textContent = 'POSTING...';
      btn.disabled = true;

      const ok = await Api.addMessage(user.username, text);
      if (ok) {
        input.value = '';
        await renderMessages();
      } else {
        alert('Failed to post. Try again.');
      }
      btn.textContent = 'POST';
      btn.disabled = false;
    }

    async function renderMessages() {
      const container = document.getElementById('messagesContainer');
      const noEl = document.getElementById('noMessages');
      const msgs = (await Api.getMessages()).reverse();

      if (msgs.length === 0) {
        container.innerHTML = '';
        noEl.style.display = 'block';
        return;
      }
      noEl.style.display = 'none';

      container.innerHTML = msgs.map(m => `
        <div class="board-msg">
          <div class="board-msg-header">
            <span class="board-msg-user">${escapeHtml(m.username)}</span>
            <span class="board-msg-time">${new Date(m.date).toLocaleString()}</span>
          </div>
          <div class="board-msg-body">${escapeHtml(m.text)}</div>
        </div>
      `).join('');
    }

    renderPostForm();
    renderMessages();
  </script>
</body>
</html>
