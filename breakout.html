<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout — Arcade Zone</title>
<link rel="stylesheet" href="css/style.css">
<style>
.game-canvas-container { background: #0a0a0a; }
canvas { border: 2px solid #f0f; display: block; }
#gameScore { position: absolute; top: 10px; left: 20px; font-size: 18px; color: #f0f; font-family: 'Courier New', monospace; }
#gameLives { position: absolute; top: 10px; right: 20px; font-size: 18px; color: #f0f; font-family: 'Courier New', monospace; }
#gameMsg { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: #f0f; font-size: 11px; text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.5s; white-space: nowrap; font-family: 'Press Start 2P', monospace; }
#gameMsg.show { opacity: 1; }
#muteBtn { position: absolute; top: 10px; right: 100px; background: none; border: 1px solid #f0f; color: #f0f; padding: 4px 10px; cursor: pointer; font-family: 'Courier New', monospace; font-size: 14px; z-index: 20; }
#gameStart { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #f0f; font-size: 16px; z-index: 15; font-family: 'Press Start 2P', monospace; }
</style>
</head>
<body>
<nav></nav>
<main>
  <div class="game-wrapper">
    <div class="game-header">
      <h1 style="font-family:'Press Start 2P',monospace;color:#ff00ff;">💥 BREAKOUT</h1>
    </div>
    <div class="game-canvas-container" style="position:relative;">
      <div id="gameScore">Score: 0</div>
      <div id="gameLives">❤️❤️❤️</div>
      <button id="muteBtn">🔊</button>
      <div id="gameStart">PRESS SPACE TO PLAY</div>
      <div id="gameMsg"></div>
      <canvas id="c" width="600" height="500"></canvas>
    </div>
    <div class="game-info">
      <span>SCORE: <strong id="infoScore">0</strong></span>
    </div>
    <div class="game-controls">
      <h3>CONTROLS</h3>
      <ul>
        <li><kbd>SPACE</kbd> — Start / Restart</li>
        <li><kbd>←</kbd> <kbd>→</kbd> — Move paddle</li>
      </ul>
    </div>
  </div>
</main>
<footer><p>👾 Arcade Zone — A School CS Project</p></footer>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
let muted = false;
document.getElementById('muteBtn').onclick = () => { muted = !muted; document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊'; };
const audio = { play(n) { if (muted) return; new Audio('audio/' + n + '.mp3').play().catch(()=>{}); } };

const W = 600, H = 500;
let paddle, ball, bricks, score, lives, started = false, gameOver = false, won = false, msgTimer = 0;

function showMsg(t, d=3000) {
  const el = document.getElementById('gameMsg'); el.textContent = t; el.classList.add('show');
  clearTimeout(msgTimer); msgTimer = setTimeout(() => el.classList.remove('show'), d);
}

async function submitScore(s) {
  const user = Auth.getCurrentUser();
  if (user && s > 0) await Api.addScore('breakout', s, user.username);
}

function init() {
  paddle = { x: 250, w: 80, h: 12, y: H - 30 };
  ball = { x: 300, y: H - 50, vx: 4, vy: -4, r: 6 };
  score = 0; lives = 3; gameOver = false; won = false;
  bricks = [];
  const colors = ['#f0f','#0ff','#0f0','#ff0','#f80','#f00'];
  for (let r = 0; r < 6; r++) for (let col = 0; col < 10; col++)
    bricks.push({ x: col * 58 + 10, y: r * 22 + 40, w: 54, h: 18, alive: true, color: colors[r], pts: (6-r)*10 });
  document.getElementById('gameScore').textContent = 'Score: 0';
  document.getElementById('gameLives').textContent = '❤️'.repeat(3);
  document.getElementById('infoScore').textContent = '0';
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    if (!started) { started = true; document.getElementById('gameStart').style.display = 'none'; audio.play('breakout-start'); init(); }
    else if (gameOver || won) init();
  }
});

let keys = {};
document.addEventListener('keydown', e => keys[e.code] = true);
document.addEventListener('keyup', e => keys[e.code] = false);

function update() {
  if (!started || gameOver || won) return;
  if (keys['ArrowLeft']) paddle.x = Math.max(0, paddle.x - 7);
  if (keys['ArrowRight']) paddle.x = Math.min(W - paddle.w, paddle.x + 7);

  ball.x += ball.vx; ball.y += ball.vy;
  if (ball.x - ball.r < 0 || ball.x + ball.r > W) ball.vx *= -1;
  if (ball.y - ball.r < 0) ball.vy *= -1;
  if (ball.y + ball.r > H) {
    lives--;
    document.getElementById('gameLives').textContent = '❤️'.repeat(lives);
    if (lives <= 0) { gameOver = true; audio.play('breakout-gameover'); showMsg('Game Over! Score: ' + score, 5000); submitScore(score); return; }
    ball.x = paddle.x + paddle.w/2; ball.y = H - 50; ball.vx = 4; ball.vy = -4;
  }

  if (ball.y + ball.r > paddle.y && ball.y - ball.r < paddle.y + paddle.h &&
      ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
    ball.vy = -Math.abs(ball.vy);
    ball.vx += (ball.x - (paddle.x + paddle.w/2)) * 0.1;
  }

  for (let b of bricks) {
    if (!b.alive) continue;
    if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
      b.alive = false; score += b.pts;
      document.getElementById('gameScore').textContent = 'Score: ' + score;
      document.getElementById('infoScore').textContent = score;
      ball.vy *= -1;
      if (bricks.every(br => !br.alive)) { won = true; showMsg('You win! Score: ' + score, 5000); submitScore(score); }
      break;
    }
  }
}

function draw() {
  ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, W, H);
  if (!started) return;
  bricks.forEach(b => { if (b.alive) { ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.w, b.h); } });
  ctx.fillStyle = '#f0f'; ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
  if (gameOver) {
    ctx.fillStyle = '#f0f'; ctx.font = '36px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/2); ctx.font = '16px Courier New'; ctx.fillText('Press SPACE to restart', W/2, H/2 + 40);
  }
  if (won) {
    ctx.fillStyle = '#0f0'; ctx.font = '36px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('YOU WIN!', W/2, H/2); ctx.font = '16px Courier New'; ctx.fillText('Press SPACE to play again', W/2, H/2 + 40);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
